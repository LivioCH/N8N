<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI漫畫行銷 — 首頁</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="form-glass">
  <div class="ribbon" aria-hidden="true"></div>

  <div class="wrap">
    <header class="hero">
      <h1 class="hero-title">AI漫畫行銷</h1>
      <p class="hero-kicker">以表單輸入，生成四張連作圖與對白，合成2x2漫畫。</p>

    </header>

    <section class="panel center">
      <h2 style="margin:0 0 10px;">AI漫畫設計問卷</h2>
      <p style="margin:0 0 12px;">開始前，您可以選擇以訪客或會員身分進行。會員可保存已生成的漫畫。</p>

      <div class="actions hstack">
        <button class="btn btn-primary" onclick="location.href='form.html'">填寫問卷產生漫畫</button>
        <button class="btn btn-ghost" onclick="location.href='auth.html'">會員登入／註冊</button>
        <button class="btn btn-ghost" onclick="location.href='my.html'"hidden>我的漫畫</button>
      </div>
    </section>
  </div>
<script src="common.js"></script>
</body>
</html>
